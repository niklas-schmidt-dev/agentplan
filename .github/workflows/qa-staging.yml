name: Staging QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: qa-staging
    env:
      QA_STAGING_URL: ${{ vars.QA_STAGING_URL }}
      QA_STAGING_CONFIRM: ${{ vars.QA_STAGING_URL }}
      QA_STAGING_EMAIL: ${{ secrets.QA_STAGING_EMAIL }}
      QA_STAGING_PASSWORD: ${{ secrets.QA_STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:staging
      - name: Preserve staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-qa-evidence
          path: .data/qa/staging/
          include-hidden-files: true
          retention-days: 7
